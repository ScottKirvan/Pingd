name: Android CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # No explicit `ref:` here — GitHub's own "Use workflow from" branch/tag
      # picker on a manual run already sets `github.ref` to whatever was
      # selected, and checkout defaults to that. An extra custom branch input
      # would just duplicate that picker (and, worse, could silently override
      # it if the two ever disagreed).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` assembles debug+release, runs unit tests, and lints across every
      # module (:app and, since Stage 1, the plain-Kotlin :core module) and fails
      # the job (non-zero exit) on any test failure, per Stage 0's acceptance
      # criteria. See app/src/test, app/src/testDebug, and core/src/test.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            core/build/reports/tests
          retention-days: 7

      # Debug-signed (installable via `adb install`) rather than the release
      # variant, which has no signing config yet and can't be installed as-is.
      # Only produced on a manual run, not on every push/PR — this is for
      # grabbing a build to test, not something every CI run needs to keep.
      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: uplinkstatus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
