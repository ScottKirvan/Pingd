name: Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  build-release-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # release-please's release_created output fires once the release PR has
          # merged into main, so main is the commit the new tag actually points at.
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NOTE: there's no release-signing config yet (see app/build.gradle.kts), so
      # this APK is unsigned and won't install as-is, and the AAB isn't signed with
      # a real upload key — both are attached for archival/manual-signing purposes
      # until a release keystore is wired in via repo secrets.
      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK and AAB to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --repo "${{ github.repository }}" \
            --clobber

  apply-staged-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    outputs:
      used_staging: ${{ steps.apply.outputs.used_staging }}
      discord_blurb: ${{ steps.apply.outputs.discord_blurb }}
    steps:
      - name: Apply staged notes and clean up
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          STAGING_BRANCH="pre-release-staging/$TAG"

          if ! gh api "repos/$REPO/branches/$STAGING_BRANCH" > /dev/null 2>&1; then
            echo "used_staging=false" >> "$GITHUB_OUTPUT"
            echo "No staging branch found for $TAG — will fall back to AI generation"
            exit 0
          fi

          echo "Found staging branch: $STAGING_BRANCH"

          NOTES=$(gh api "repos/$REPO/contents/.github/tmp/pre-release-staging/release-notes.md?ref=$STAGING_BRANCH" \
            --jq '.content' | base64 -d)
          BLURB=$(gh api "repos/$REPO/contents/.github/tmp/pre-release-staging/discord-blurb.txt?ref=$STAGING_BRANCH" \
            --jq '.content' | base64 -d 2>/dev/null || echo "")

          printf '%s' "$NOTES" > /tmp/staged-release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/staged-release-notes.md
          echo "Applied staged release notes to $TAG"

          gh api "repos/$REPO/git/refs/heads/$STAGING_BRANCH" --method DELETE || true
          echo "Deleted staging branch: $STAGING_BRANCH"

          echo "used_staging=true" >> "$GITHUB_OUTPUT"
          { echo 'discord_blurb<<BLURB_EOF'
            printf '%s\n' "$BLURB"
            echo 'BLURB_EOF'
          } >> "$GITHUB_OUTPUT"

  improve-release-notes:
    needs: [release-please, apply-staged-notes]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.apply-staged-notes.outputs.used_staging == 'false'
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "UplinkStatus"
      project_context: "UplinkStatus is an Android status-bar app that monitors uplink health using TCP probe-based network checks — giving users a persistent, real-time connectivity indicator in their status bar. Write changes in terms of what the status indicator shows, how accurately it reflects connectivity, or what users can configure."
      header: |
        ## UplinkStatus

        > Real-time uplink health indicator for your Android status bar.

        🫶❤️[Support this project](https://ko-fi.com/ScottKirvan) · 📖 [User Guide](https://scottkirvan.github.io/UplinkStatus/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/UplinkStatus/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/UplinkStatus/issues/new?template=feature_request.md) · 📋 [Changelog](https://github.com/ScottKirvan/UplinkStatus/blob/main/notes/CHANGELOG.md)

        ---
      footer: ""
    secrets: inherit

  update-changelog-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-update-changelog-prs.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  discord-notify:
    needs: [release-please, apply-staged-notes, improve-release-notes]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      !failure() && !cancelled()
    uses: ScottKirvan/.github/.github/workflows/reusable-discord-notify.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "UplinkStatus"
      emoji: "📡"
      discord_blurb: ${{ needs.apply-staged-notes.outputs.discord_blurb || needs.improve-release-notes.outputs.discord_blurb }}
    secrets: inherit
